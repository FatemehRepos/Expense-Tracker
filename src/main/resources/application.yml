logging:
  level:
    root: debug
security:
  jwt:
    expirationTime: 3600000
    secretKey: thisIsAProjectForManageYourExpensesThatItsNameIsExpenseTracker
spring:
  application:
    name: expense-tracker
  datasource:
    driverClassName: org.h2.Driver
    password: sa
    url: jdbc:h2:mem:expense-tracker-db
    username: sa
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    defer-datasource-initialization: true
server:
  port: 8020
